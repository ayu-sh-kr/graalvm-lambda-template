AWSTemplateFormatVersion: '2010-09-09'
Description: Native Kotlin HTTP application on Lambda with Web Adapter
Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI including its immutable tag or digest
  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  Function:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt FunctionRole.Arn
      Architectures: [!Ref Architecture]
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          PORT: '8080'
          AWS_LWA_PORT: '8080'
          AWS_LWA_READINESS_CHECK_PATH: /health
          AWS_LWA_READINESS_CHECK_HEALTHY_STATUS: '200'
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Function}
      RetentionInDays: 14
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: AWS_IAM
      InvokeMode: BUFFERED
Outputs:
  FunctionName:
    Value: !Ref Function
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
