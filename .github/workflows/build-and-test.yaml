name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      # Maven Wrapper installs Maven; the Kotlin Maven plugin installs Kotlin 2.3.21.
      - name: Set up Maven and Kotlin
        run: ./mvnw --batch-mode --version

      - name: Build project
        run: ./mvnw --batch-mode --update-snapshots clean package -DskipTests

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4
      # Maven Wrapper installs Maven; the Kotlin Maven plugin installs Kotlin 2.3.21.
      - name: Set up Maven and Kotlin
        run: ./mvnw --batch-mode --version

      - name: Run integration tests
        run: ./mvnw --batch-mode test '-Dtest=*IntegrationTests'
